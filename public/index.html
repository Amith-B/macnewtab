<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>New Tab</title>
    <script src="%PUBLIC_URL%/boot.js"></script>
    <style>
      html { background: #efefee; }
      #boot-skeleton {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        overflow: hidden;
        background: var(--bs-bg, #efefee);
        pointer-events: none;
        transition: opacity 0.1s ease;
        --bs-block: rgba(0, 0, 0, 0.1);
      }
      html[data-boot-dark] #boot-skeleton { --bs-block: rgba(255, 255, 255, 0.14); }
      #boot-skeleton.boot-skeleton--out { opacity: 0; }
      /* Iris Reveal: boot.js adds this class and animates --iris-radius (see dismiss()).
         Only this lightweight overlay is animated, never the live page. */
      #boot-skeleton.boot-skeleton--iris { transition: none; }
      @property --iris-radius {
        syntax: "<length>";
        inherits: false;
        initial-value: 0px;
      }
      #boot-skeleton.boot-skeleton--iris {
        -webkit-mask-image: radial-gradient(
          circle at 50% 50%,
          transparent 0,
          transparent var(--iris-radius),
          #000 calc(var(--iris-radius) + 1px)
        );
        mask-image: radial-gradient(
          circle at 50% 50%,
          transparent 0,
          transparent var(--iris-radius),
          #000 calc(var(--iris-radius) + 1px)
        );
      }
      /* your own wallpaper, blurred (thumbnail cached by the app) */
      html[data-boot-img] #boot-skeleton::before {
        content: "";
        position: absolute;
        inset: -6%;
        background: var(--bs-img) center / cover no-repeat;
        filter: blur(16px);
      }
      #boot-skeleton i {
        display: block;
        background: var(--bs-block);
        filter: blur(14px);
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      .bs-clock { width: 220px; height: 120px; border-radius: 28px; }
      .bs-search { width: min(560px, 80vw); height: 52px; border-radius: 26px; }
      .bs-tiles { display: flex; gap: 22px; }
      .bs-tiles i { width: 56px; height: 56px; border-radius: 16px; }
      .bs-dock {
        position: absolute;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 14px;
        padding: 10px 16px;
      }
      .bs-dock i { width: 44px; height: 44px; border-radius: 12px; }
      @keyframes boot-pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #boot-skeleton i { animation: none; }
        #boot-skeleton { transition: none; }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="boot-skeleton" aria-hidden="true">
      <i class="bs-clock"></i>
      <i class="bs-search"></i>
      <div class="bs-tiles"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="bs-dock"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
